<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدول شگفت‌انگیز ریاضی | مریم سماکار</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f8fa;color:#20242a}.wrap{max-width:720px;margin:auto;padding:20px 14px 32px;text-align:center}h1{font-size:25px;margin:8px 0}.sub{color:#5f6670;font-size:14px;line-height:1.8}#status{min-height:28px;margin:10px 0;font-weight:bold}.board{display:grid;grid-template-columns:repeat(9,1fr);max-width:560px;margin:14px auto;border:3px solid #ef6c00;direction:ltr;background:#fff}.cell{aspect-ratio:1;border:1px solid #b9dce9;background:#fff;font-size:clamp(20px,5vw,35px);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer}.cell:nth-child(3n){border-right:3px solid #ef6c00}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):-child(-n+54){border-bottom:3px solid #ef6c00}.given{background:#f5f5f5;cursor:default}.selected{background:#fff0dc!important;outline:3px solid #ef6c00;outline-offset:-3px}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:560px;margin:12px auto}button{font-family:inherit;min-height:46px;border-radius:9px;border:1px solid #d5d9de;background:#fff;cursor:pointer}.num{font-size:20px;font-weight:bold}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.primary{background:#fff0dc;border-color:#ef6c00;font-weight:bold;padding:10px 18px}.credit{margin-top:18px;color:#6a717b;font-size:13px}@media(max-width:420px){.wrap{padding:14px 8px}.pad{gap:4px}.cell{font-size:22px}}</style></head><body><div class="wrap"><h1>جدول شگفت‌انگیز ریاضی</h1><div class="sub">اعداد ۱ تا ۹ را طوری قرار بده که در هر سطر، ستون و مربع ۳×۳، هر عدد فقط یک‌بار بیاید.</div><div id="status">یک خانه خالی را انتخاب کن.</div><div id="board" class="board"></div><div id="pad" class="pad"></div><div class="actions"><button id="check" class="primary">بررسی پاسخ</button><button id="new" class="primary">جدول جدید</button></div><div class="credit">طراح: <b>مریم سماکار</b></div></div><script>const fa=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];let solution=[],puzzle=[],selected=-1;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSolution(){let g=Array.from({length:9},()=>Array(9).fill(0));function ok(r,c,n){for(let i=0;i<9;i++)if(g[r][i]===n||g[i][c]===n)return false;let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)if(g[rr][cc]===n)return false;return true}function fill(p){if(p===81)return true;let r=Math.floor(p/9),c=p%9;for(const n of shuffle([1,2,3,4,5,6,7,8,9]))if(ok(r,c,n)){g[r][c]=n;if(fill(p+1))return true;g[r][c]=0}return false}fill(0);return g}function newGame(){solution=makeSolution();puzzle=solution.map(r=>r.slice());let cells=shuffle([...Array(81).keys()]);let remove=45+Math.floor(Math.random()*7);for(let i=0;i<remove;i++){let p=cells[i];puzzle[Math.floor(p/9)][p%9]=0}selected=-1;render();status.textContent='یک خانه خالی را انتخاب کن.'}function render(){board.innerHTML='';for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.className='cell '+(puzzle[r][c]?'given':'');b.textContent=puzzle[r][c]?fa[puzzle[r][c]]:'';b.type='button';if(!puzzle[r][c])b.onclick=()=>{selected=i;document.querySelectorAll('.cell').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');status.textContent='عدد مورد نظر را انتخاب کن.'};board.appendChild(b)}}function setNum(n){if(selected<0){status.textContent='ابتدا یک خانه خالی را انتخاب کن.';return}let r=Math.floor(selected/9),c=selected%9;if(!puzzle[r][c]){puzzle[r][c]=n;selected=-1;render();status.textContent='عدد ثبت شد.'}}for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.type='button';b.textContent=fa[n];b.onclick=()=>setNum(n);pad.appendChild(b)}let del=document.createElement('button');del.type='button';del.textContent='پاک کردن';del.onclick=()=>{if(selected>=0){let r=Math.floor(selected/9),c=selected%9;puzzle[r][c]=0;selected=-1;render();status.textContent='خانه پاک شد.'}};pad.appendChild(del);check.onclick=()=>{let empty=0,wrong=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++){if(!puzzle[r][c])empty++;else if(puzzle[r][c]!==solution[r][c])wrong++}if(wrong)status.textContent='بعضی از پاسخ‌ها درست نیستند؛ دوباره تلاش کن.';else if(empty)status.textContent='آفرین! پاسخ‌های واردشده درست‌اند؛ هنوز '+fa[empty]+' خانه باقی مانده است.';else status.textContent='🎉 آفرین! جدول را کامل و درست حل کردی.'};new.onclick=newGame;newGame();</script></body></html>
